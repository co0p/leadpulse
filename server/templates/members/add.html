{{/* members/add.html — Add member form page */}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member — Team Impact Scorecard</title>
    <link rel="stylesheet" href="/dist/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { height: 100vh; display: flex; flex-direction: column; }
        .topbar { height: 56px; background-color: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 1.25rem; }
        .main-content { flex: 1; overflow-y: auto; background-color: #fafafa; padding: 1.25rem; }
        .form-container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.875rem; font-weight: 600; margin-bottom: 1.25rem; }
        .field { margin-bottom: 1.5rem; }
        .label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        .input, .select { width: 100%; padding: 0.5rem; border: 1px solid #e8e8e8; border-radius: 4px; font-size: 1rem; }
        .input:focus, .select:focus { outline: 2px solid #3273dc; outline-offset: 2px; border-color: #3273dc; }
        .help { font-size: 0.875rem; color: #7a7a7a; margin-top: 0.25rem; }
        .error-message { color: #f14668; font-size: 0.875rem; margin-bottom: 1rem; padding: 0.75rem; background-color: #fff5f7; border-left: 4px solid #f14668; }
        .buttons { display: flex; gap: 0.5rem; margin-top: 2rem; }
        .button { padding: 0.75rem 1.5rem; font-size: 1rem; border: none; border-radius: 4px; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
        .button.is-primary { background-color: #3273dc; color: white; }
        .button.is-primary:hover { background-color: #2366d1; }
        .button:focus { outline: 2px solid #3273dc; outline-offset: 2px; }
        .button.is-light { background-color: #f5f5f5; color: #4a4a4a; }
        .button.is-light:hover { background-color: #ebebeb; }
        a { color: #3273dc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 767px) { .main-content { padding: 0.75rem; } .button { padding: 0.5rem 1rem; } }
    </style>
</head>
<body>
    <header class="topbar" role="banner">
        <h2 style="margin: 0; font-size: 1rem;">Add Member</h2>
    </header>

    <main class="main-content" role="main">
        <div class="form-container">
            <h1>Add New Member</h1>

            {{if .Error}}
            <div class="error-message" role="alert">
                {{.Error}}
            </div>
            {{end}}

            <form method="POST" action="/members" novalidate>
                <!-- First Name -->
                <div class="field">
                    <label class="label" for="firstName">First Name</label>
                    <div>
                        <input 
                            class="input" 
                            type="text" 
                            id="firstName" 
                            name="firstName" 
                            placeholder="John"
                            maxlength="100"
                            required
                            value="{{.FirstName}}"
                            aria-label="Member first name"
                        >
                    </div>
                    <p class="help">First name of the team member</p>
                </div>

                <!-- Last Name -->
                <div class="field">
                    <label class="label" for="lastName">Last Name</label>
                    <div>
                        <input 
                            class="input" 
                            type="text" 
                            id="lastName" 
                            name="lastName" 
                            placeholder="Doe"
                            maxlength="100"
                            required
                            value="{{.LastName}}"
                            aria-label="Member last name"
                        >
                    </div>
                    <p class="help">Last name of the team member</p>
                </div>

                <!-- Seniority -->
                <div class="field">
                    <label class="label" for="seniority">Seniority</label>
                    <div>
                        <select 
                            id="seniority" 
                            name="seniority" 
                            class="select"
                            required 
                            aria-label="Member seniority level"
                        >
                            <option value="">— Select seniority —</option>
                            <option value="junior" {{if eq .Seniority "junior"}}selected{{end}}>Junior</option>
                            <option value="mid" {{if eq .Seniority "mid"}}selected{{end}}>Mid-Level</option>
                            <option value="senior" {{if eq .Seniority "senior"}}selected{{end}}>Senior</option>
                            <option value="lead" {{if eq .Seniority "lead"}}selected{{end}}>Lead</option>
                        </select>
                    </div>
                    <p class="help">Seniority level helps contextualize impact expectations</p>
                </div>

                <!-- Action Buttons -->
                <div class="buttons">
                    <button type="submit" class="button is-primary">Add Member</button>
                    <a href="/members" class="button is-light">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Client-side validation
        document.querySelector('form').addEventListener('submit', function(e) {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const seniority = document.getElementById('seniority').value;

            if (!firstName) {
                alert('First name is required');
                e.preventDefault();
                return;
            }

            if (!lastName) {
                alert('Last name is required');
                e.preventDefault();
                return;
            }

            if (!seniority) {
                alert('Seniority is required');
                e.preventDefault();
                return;
            }

            // Disable button to prevent double-submit
            document.querySelector('button[type="submit"]').disabled = true;
        });
    </script>
</body>
</html>
