{{define "components/topbar"}}
<header class="topbar" role="banner">
    <div class="topbar-left">
        <button class="button is-white is-hidden-desktop sidebar-toggle" type="button" aria-label="Toggle sidebar" aria-expanded="false">
            <span class="icon">
                <i class="fas fa-bars"></i>
            </span>
        </button>
        <div class="breadcrumb-area">
            <span class="breadcrumb-text">Dashboard</span>
        </div>
    </div>

    <div class="topbar-center">
        <div class="field has-addons is-fullwidth">
            <p class="control is-expanded has-icons-left">
                <input class="input" type="text" placeholder="Search..." aria-label="Search">
                <span class="icon is-left">
                    <i class="fas fa-search"></i>
                </span>
            </p>
        </div>
    </div>

    <div class="topbar-right">
        <div class="level-right">
            <div class="level-item">
                <div class="buttons">
                    <button class="button is-ghost" type="button" aria-label="Notifications">
                        <span class="icon">
                            <i class="fas fa-bell"></i>
                        </span>
                    </button>
                    <button class="button is-ghost" type="button" aria-label="Help">
                        <span class="icon">
                            <i class="fas fa-question-circle"></i>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>
{{end}}
